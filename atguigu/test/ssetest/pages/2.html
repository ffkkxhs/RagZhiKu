<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>example2</title>
</head>
<body>
    <h2>222222222</h2>
    请输入自己的会话id:<input type="text" id="sessionId"> <br>
    请输入自己的问题：<input type="text" id="query"> <br>
    <button id="btn">按钮</button>
    <div id="content">
    </div>

    <script>
        const btn = document.getElementById("btn")


        btn.onclick = async function (){
            const session_id = document.getElementById("sessionId").value
            const query = document.getElementById("query").value

            const res = await fetch("http://localhost:8000/startWork",{
                method:"POST",
                headers:{
                    "content-type":"application/json"
                },
                body:JSON.stringify({
                    "session_id":session_id,
                    "query":query
                })
            })
            const data = await res.json()
            console.log(data)

            const es = new EventSource(`http://localhost:8000/sse02?session_id=${session_id}`)
            es.onmessage = function(e){
                if(e.data === "None"){
                    es.close()
                }else {
                    const contentDiv = document.getElementById("content")
                    contentDiv.innerHTML += e.data + "<br>"
                }
            }
        }
    </script>
</body>
</html>
