[project]
name = "ragzhiku"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.162.0",
    "grandalf>=0.8",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "minio>=7.2.20",
    "numpy>=2.5.4",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "rprint>=0.0.8",
    "typing-extensions>=4.16.0",
    # GPU / 向量化：精确钉死，禁止任何漂移
    "torch==2.11.0",
    "flagembedding>=1.3.5,<2.0.0",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.2",
    "modelscope>=1.40.2",
    "openai-agents>=0.24.0",
    "dashscope>=2.1.0",
]

# 默认源写进项目，别只依赖你机器上的全局 uv.toml
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
